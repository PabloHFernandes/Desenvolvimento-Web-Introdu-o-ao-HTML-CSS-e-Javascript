
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        table, th, td {
            border: 1px solid #aaa;
            padding: 18px 10px;
            text-align: center;
            border-collapse: collapse;
            text-align: center;
            padding: 20px;
        }
        .cabecalho{
            background-color: blue;
            color: white;
        }

    </style>
</head>
<body>
    <table>
        <caption>Horários e atividades da semana</caption>
        <tr class="cabecalho">
            <th></th>
            <th>DOM</th>
            <th>SEG</th>
            <th>TER</th>
            <th>QUA</th>
            <th>QUI</th>
            <th>SEX</th>
            <th>SÁB</th>
        </tr>
        <tr>
            <th class="cabecalho">MANHÃ</th>
            <td>Descanso</td>
            <td>Estudar</td>
            <td>Estudar</td>
            <td>Estudar</td>
            <td>Estudar</td>
            <td>Estudar</td>
            <td rowspan="3">Lazer</td>
        </tr>

        <tr>
            <th class="cabecalho">TARDE</th>
            <td rowspan="2">Lazer</td>
            <td>Lazer</td>
            <td>Lazer</td>
            <td>Lazer</td>
            <td>Lazer</td>
            <td>Lazer</td>
        </tr>

        <tr>
            <th class="cabecalho">NOITE</th>
            <td>Faculdade</td>
            <td>Faculdade</td>
            <td>Faculdade</td>
            <td>Faculdade</td>
            <td>Descanso</td>
        </tr>
    </table>
</body>
</html>
